name: Malicious Code Analysis

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write
  checks: write

env:
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:

  # ============================================================
  # ANALYSIS 1: CodeQL Semantic Analysis
  # ============================================================
  codeql:
    name: "1/10 CodeQL"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, go, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
        continue-on-error: true
      - uses: github/codeql-action/analyze@v3


  # ============================================================
  # ANALYSIS 2: TruffleHog - Secret & Credential Leak Detection
  # ============================================================
  trufflehog:
    name: "2/10 TruffleHog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          fail_on_detections: false
          extra_args: --only-verified --results=verified,unverified


  # ============================================================
  # ANALYSIS 3: Gitleaks - Git History Secret Scanning
  # ============================================================
  gitleaks:
    name: "3/10 Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2.3.7
        continue-on-error: true
      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30


  # ============================================================
  # ANALYSIS 4: Semgrep - Custom Rule Static Analysis
  # ============================================================
  semgrep:
    name: "4/10 Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/command-injection
            p/supply-chain
          auditOn: push
          generateSarif: true
        env:
          SEMGREP_SEND_METRICS: "off"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep


  # ============================================================
  # ANALYSIS 5: GuardDog - Malicious Package Detection
  # ============================================================
  guarddog:
    name: "5/10 GuardDog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GuardDog
        run: pip install guarddog
      - name: Scan PyPI dependencies
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then
            guarddog pypi scan requirements.txt --output-format sarif > guarddog-pypi.sarif 2>/dev/null || true
          else
            echo "No requirements.txt"
          fi
      - name: Scan npm dependencies
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            guarddog npm scan package.json --output-format sarif > guarddog-npm.sarif 2>/dev/null || true
          else
            echo "No package.json"
          fi
      - name: Upload GuardDog PyPI SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: guarddog-pypi.sarif
          category: guarddog-pypi
      - name: Upload GuardDog npm SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: guarddog-npm.sarif
          category: guarddog-npm


  # ============================================================
  # ANALYSIS 6: Bandit - Python Security Linter
  # ============================================================
  bandit:
    name: "6/10 Bandit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Bandit Scan
        continue-on-error: true
        run: |
          count=$(find . -name '*.py' -type f 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            bandit -r . -f sarif -o bandit-results.sarif --severity-level all --confidence-level all 2>/dev/null || true
          else
            echo "No Python files"
          fi
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: bandit-results.sarif
          category: bandit


  # ============================================================
  # ANALYSIS 7: Dependency Supply Chain Review
  # ============================================================
  dependency-review:
    name: "7/10 Dependency Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
          vulnerability-check: true
          license-check: false


  # ============================================================
  # ANALYSIS 8: Custom Malicious Pattern Detection
  # ============================================================
  malicious-patterns:
    name: "8/10 Malicious Patterns"
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.scan.outputs.critical }}
      high: ${{ steps.scan.outputs.high }}
      total: ${{ steps.scan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Malicious Pattern Scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          HAS_ISSUES=0
          TOTAL=0
          CRITICAL=0
          HIGH=0
          MEDIUM=0

          markdown="## Malicious Pattern Scan Results\n\n"

          # Decide scan scope
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...${{ github.head_ref }}" --diff-filter=ACMRT 2>/dev/null | grep -E '\.(py|js|ts|jsx|tsx|rb|php|sh|bash|ps1|go|java|kt|cs|rs|c|cpp|h|hpp|swift|scala|lua|pl|r|psm1)$' || true)
            SCOPE="PR changed files"
          else
            FILES=$(find . -type f 2>/dev/null | grep -E '\.(py|js|ts|jsx|tsx|rb|php|sh|bash|ps1|go|java|kt|cs|rs|c|cpp|h|hpp|swift|scala|lua|pl|r|psm1)$' || true)
            SCOPE="all files"
          fi

          echo "::notice::Scanning $SCOPE"

          # ---------- pattern groups ----------
          critical_patterns() {
            cat <<'EOFM'
BASE64_EVAL:(?i)eval\(.*base64.*decode
BASE64_EXEC:(?i)exec\(.*base64.*decode
ATOB_LONG:(?i)atob\(['"][A-Za-z0-9+/=]{40,}
OBF_HEX:(?i)(\\x[0-9a-f]{2}){12,}
OBF_UNICODE:(?i)(\\u[0-9a-f]{4}){10,}
FROMCHARCODE:(?i)String\.fromCharCode\s*\([\d,]{60,}
JSFUCK_ARRAY:(\[\]\[\[\]\])
JSFUCK_BANG:(\[!\[\]\])
CRYPTONIGHT:(?i)cryptonight
CRYPTOLOOT:(?i)cryptoloot
COINIMP:(?i)coinimp
COINHIVE:(?i)coin-hive
XMRIG:(?i)xmrig
STRATUM:(?i)stratum\+tcp
CPUMINER:(?i)cpuminer
REVSH_CONNECT:(?i)sh\.connect_back
REVSH_SOCKET:(?i)socket\.connect\s*\(\s*\(?\s*['"][^'"]*
REVSH_NCE:(?i)nc\s+-e\s+
REVSH_DEVTCP:(?i)/dev/tcp/
REVSH_BASH:(?i)bash\s+-i\s+>&\s+/dev/tcp/
SHELL_SUBPROCESS:(?i)subprocess\.(call|Popen|run|check_output|check_call)\s*\(
SHELL_OS_SYSTEM:(?i)os\.system\s*\(
SHELL_TRUE:(?i)shell=True
CHMOD_777:(?i)chmod\s+.*777
CHMOD_PLUS_S:(?i)chmod\s+.*\+s
EVAL_LITERAL:(?i)\beval\s*\(\s*['"`]
EXEC_LITERAL:(?i)\bexec\s*\(\s*['"`]
CHILD_EXEC:(?i)child_process\.exec(?:Sync)?\s*\(
COMPILE_OPEN:(?i)compile\(\s*open\s*\(
EXEC_OPEN:(?i)exec\(\s*open\s*\(
DYN_IMPORT_HTTP:(?i)require\(['"`].*http
DYN_IMPORT_BITLY:(?i)require\(['"`].*bit\.ly
DYN_IMPORT_PASTEBIN:(?i)require\(['"`].*pastebin
CURL_WGET_EXFIL:(?i)(curl|wget|fetch)\s+https?://(?!.*github\.com|.*githubusercontent\.com|.*npmjs\.org|.*pypi\.org|.*rubygems\.org|.*docker\.com)
OS_ENVIRON_SECRET:(?i)os\.environ\.(?:get|__getitem__)\(['\"].*(?:SECRET|TOKEN|PASSWORD|API_KEY|KEY)
PROCESS_ENV_SECRET:(?i)process\.env\.(?:SECRET|TOKEN|PASSWORD|API_KEY)
KNOWN_MALWARE:(?i)(?:require|import)\s*\(?\s*['\"](?:crossenv|cross-env\.js|babel-loan|electorn|loady-darty|mimic-fn|serf-js|js-bson-evil|bson-js-evil|mailparserjs|mssql\.js|node-fabric|node-pdf-constructor|pnpm|proxy-poxies|yarrr|all-elements|getcookies|express-upload-screen|cookies-fetcher)['\"]
KNOWN_MALWARE_NODE_MODULES:['"]node_modules/[^'"]*(?:hack|malware|virus|trojan|exploit)['"]
EOFM
          }

          medium_patterns() {
            cat <<'EOFM'
SETTIMEOUT_STRING:(?i)setTimeout\s*\(\s*['"`]
SETINTERVAL_STRING:(?i)setInterval\s*\(\s*['"`]
NEW_FUNCTION:(?i)new Function\s*\(
XMLHTTP:(?i)XMLHttpRequest\s*\(
SENDBEACON:(?i)navigator\.sendBeacon\(
BASH_HIST:(?i)\.(bash_history|ssh|gnupg|aws|config|git-credentials)
PASSWD_FILE:(?i)(passwd|shadow|sudoers)
BASHRC_BASH:(?i)\|.*bash\b
BASH_EXEC:(?i)exec\s+[\$"].*[;&|]
PYTHON_C_SHELL:(?i)python\s+-c\s+['\"].*socket.*connect
PTY_SPAWN:(?i)pty\.spawn.*bash
MINER_START:(?i)miner\.start
MINER_STOP:(?i)miner\.stop
WEBMINE:(?i)webmine
MINER_URL:(?i)miner_url
LARGE_B64:[A-Za-z0-9+/=]{80,}
EOFM
          }

          # ---------- scan each file ----------
          for file in $FILES; do
            [ ! -f "$file" ] && continue
            content=$(cat "$file" 2>/dev/null) || continue

            # Check critical patterns
            while IFS=: read -r name pattern; do
              [ -z "$name" ] && continue
              matches=$(echo "$content" | grep -cP "$pattern" 2>/dev/null || true)
              if [ "$matches" -gt 0 ]; then
                lines=$(echo "$content" | grep -nP "$pattern" 2>/dev/null | head -5)
                echo "::error file=$file::CRITICAL: $name ($matches match(es))"
                markdown="${markdown}- **CRITICAL** \`$name\` in \`$file\` ($matches hit(s))\n"
                HAS_ISSUES=1
                TOTAL=$((TOTAL + matches))
                CRITICAL=$((CRITICAL + matches))
              fi
            done <<< "$(critical_patterns)"

            # Check medium patterns
            while IFS=: read -r name pattern; do
              [ -z "$name" ] && continue
              matches=$(echo "$content" | grep -cP "$pattern" 2>/dev/null || true)
              if [ "$matches" -gt 0 ]; then
                echo "::warning file=$file::MEDIUM: $name ($matches match(es))"
                markdown="${markdown}- **MEDIUM** \`$name\` in \`$file\` ($matches hit(s))\n"
                HAS_ISSUES=1
                TOTAL=$((TOTAL + matches))
                MEDIUM=$((MEDIUM + matches))
              fi
            done <<< "$(medium_patterns)"

            # shell check: eval/exec with string arg
            if echo "$content" | grep -qP '(?i)\beval\s*\(\s*[''"`]' 2>/dev/null; then
              # flagged above already
              :
            fi
          done

          # Write outputs
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$HAS_ISSUES" = "1" ]; then
            echo "status=issues_found" >> "$GITHUB_OUTPUT"
          else
            echo "status=clean" >> "$GITHUB_OUTPUT"
          fi

          # Write summary
          {
            echo "## Malicious Pattern Scan Results"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| **Critical** | $CRITICAL |"
            echo "| **High** | $HIGH |"
            echo "| **Medium** | $MEDIUM |"
            echo "| **Total** | $TOTAL |"
            echo ""
            if [ "$HAS_ISSUES" = 1 ]; then
              echo -e "$markdown"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with Findings
        if: github.event_name == 'pull_request' && steps.scan.outputs.status == 'issues_found'
        uses: actions/github-script@v7
        with:
          script: |
            const c = parseInt('${{ steps.scan.outputs.critical }}') || 0;
            const h = parseInt('${{ steps.scan.outputs.high }}') || 0;
            const m = parseInt('${{ steps.scan.outputs.medium }}') || 0;
            const t = parseInt('${{ steps.scan.outputs.total }}') || 0;
            let body = '## Malicious Pattern Scan Report\n\n';
            if (c > 0) body += `:rotating_light: **${c} critical** pattern(s) detected!`;
            if (h > 0) body += `\n:warning: **${h} high** severity pattern(s) detected.`;
            if (m > 0) body += `\n:grey_exclamation: **${m} medium** severity pattern(s) detected.`;
            body += `\n\n**Total: ${t} finding(s)** across the changed files.\n`;
            body += '\nCheck the Actions tab for the full report (Analysis 8/10).';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block on Critical Findings
        if: steps.scan.outputs.critical > 0
        run: |
          echo "::error::CRITICAL malicious patterns found (count: ${{ steps.scan.outputs.critical }}). Review before merging."
          exit 1


  # ============================================================
  # ANALYSIS 9: Entropy & Obfuscation Detection
  # ============================================================
  entropy-analysis:
    name: "9/10 Entropy Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entropy Scan
        continue-on-error: true
        shell: bash
        run: |
          echo "# Entropy & Obfuscation Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          SUSPICIOUS=0
          TOTAL=0
          report=""

          scan_file() {
            local file="$1"
            local content
            content=$(cat "$file" 2>/dev/null) || return
            TOTAL=$((TOTAL + 1))

            local flags=""
            local severity="LOW"

            # base64-like strings >= 80 chars
            local b64
            b64=$(echo "$content" | grep -cP '[A-Za-z0-9+/=]{80,}' 2>/dev/null || true)
            [ "$b64" -gt 2 ] && flags="${flags}base64($b64) " && severity="MEDIUM"

            # hex escapes
            local hex
            hex=$(echo "$content" | grep -cP '(\\x[0-9a-f]{2}){15,}' 2>/dev/null || true)
            [ "$hex" -gt 0 ] && flags="${flags}hex-escapes($hex) " && severity="HIGH"

            # unicode escapes
            local uni
            uni=$(echo "$content" | grep -cP '(\\u[0-9a-f]{4}){10,}' 2>/dev/null || true)
            [ "$uni" -gt 0 ] && flags="${flags}unicode-escapes($uni) " && severity="HIGH"

            # avg line length > 200 (minified)
            local lines wc_c avg
            lines=$(echo "$content" | wc -l 2>/dev/null || echo 0)
            wc_c=$(echo "$content" | wc -c 2>/dev/null || echo 0)
            if [ "$lines" -gt 0 ] && [ "$wc_c" -gt 5000 ]; then
              avg=$((wc_c / lines))
              [ "$avg" -gt 200 ] && flags="${flags}minified(avg=${avg}) " && [ "$severity" != "HIGH" ] && severity="MEDIUM"
            fi

            if [ -n "$flags" ]; then
              SUSPICIOUS=$((SUSPICIOUS + 1))
              report="${report}| \`$file\` | ${severity} | ${flags} |\n"
            fi
          }

          while IFS= read -r file; do
            scan_file "$file"
          done < <(find . -type f 2>/dev/null | grep -E '\.(py|js|ts|jsx|tsx|rb|php|sh|bash|ps1|go|java|kt|cs|rs|c|cpp|h|hpp|swift|scala|lua|pl|r)$' || true)

          {
            echo "**Files scanned:** $TOTAL"
            echo "**Suspicious files:** $SUSPICIOUS"
            echo ""
            if [ "$SUSPICIOUS" -gt 0 ]; then
              echo "| File | Severity | Indicators |"
              echo "|------|----------|------------|"
              echo -e "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "suspicious=$SUSPICIOUS" >> "$GITHUB_OUTPUT"


  # ============================================================
  # ANALYSIS 10: File Integrity & Artifact Verification
  # ============================================================
  artifact-integrity:
    name: "10/10 Integrity Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrity Scan
        continue-on-error: true
        shell: bash
        run: |
          echo "# File Integrity & Artifact Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          FINDINGS=0

          # -- binary files in source tree (potential payload) --
          binaries=$(find . -type f 2>/dev/null \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            -not -path './target/*' \
            -not -path './bin/*' \
            -not -path './obj/*' \
            \( -name '*.exe' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' -o -name '*.bin' \
               -o -name '*.elf' -o -name '*.class' -o -name '*.jar' -o -name '*.war' \
               -o -name '*.apk' -o -name '*.dex' -o -name '*.pyc' -o -name '*.pyd' \
               -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.wasm' \) | head -20)

          if [ -n "$binaries" ]; then
            echo "### Binary Artifacts" >> "$GITHUB_STEP_SUMMARY"
            echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "$binaries" | while IFS= read -r f; do
              sz=$(du -h "$f" 2>/dev/null | cut -f1)
              echo "| \`$f\` | $sz |" >> "$GITHUB_STEP_SUMMARY"
              FINDINGS=$((FINDINGS + 1))
            done
          fi

          # -- large data files (>1MB) --
          large=$(find . -type f -size +1M 2>/dev/null \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            \( -name '*.csv' -o -name '*.json' -o -name '*.xml' -o -name '*.sql' -o -name '*.db' \
               -o -name '*.sqlite' -o -name '*.dat' -o -name '*.log' -o -name '*.txt' \) | head -10)

          if [ -n "$large" ]; then
            echo "### Large Data Files" >> "$GITHUB_STEP_SUMMARY"
            echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "$large" | while IFS= read -r f; do
              sz=$(du -h "$f" 2>/dev/null | cut -f1)
              echo "| \`$f\` | $sz |" >> "$GITHUB_STEP_SUMMARY"
              FINDINGS=$((FINDINGS + 1))
            done
          fi

          if [ "$FINDINGS" -eq 0 ]; then
            echo "No integrity issues found." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"


  # ============================================================
  # FINAL: Aggregate Report
  # ============================================================
  aggregate-report:
    name: "Final Report"
    needs:
      - codeql
      - trufflehog
      - gitleaks
      - semgrep
      - guarddog
      - bandit
      - dependency-review
      - malicious-patterns
      - entropy-analysis
      - artifact-integrity
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Aggregate Summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
# Complete Report - All 10 Analyses

| # | Analysis | Status |
|---|----------|--------|
| 1 | CodeQL Semantic Analysis | ✅ Completed |
| 2 | TruffleHog Secrets Scan | ✅ Completed |
| 3 | Gitleaks Git History Scan | ✅ Completed |
| 4 | Semgrep SAST Scan | ✅ Completed |
| 5 | GuardDog Malicious Package Scan | ✅ Completed |
| 6 | Bandit Python Security Lint | ✅ Completed |
| 7 | Dependency Supply Chain Review | ✅ Completed |
| 8 | Custom Malicious Pattern Scan | ✅ Completed |
| 9 | Entropy & Obfuscation Analysis | ✅ Completed |
| 10 | File Integrity & Artifact Scan | ✅ Completed |

## Where to View Results

| Report Location | Details |
|-----------------|---------|
| **GitHub Security Tab** | CodeQL, Semgrep, and Bandit SARIF results appear here |
| **PR Comments** | Dependency Review + Malicious Pattern findings posted on PRs |
| **Action Step Summaries** | Per-job markdown summaries for analyses 8-10 |
| **Action Logs** | Detailed line-level output in each job log |
EOF

      - name: Final Check
        run: echo "All 10 malicious-code analyses completed."
